<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пиксельное сердечко</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0b1a;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: monospace;
        }

        /* Контейнер для сердечка */
        .heart-container {
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        /* Пиксельное сердечко через box-shadow */
        .pixel-heart {
            width: 20px;
            height: 20px;
            background: transparent;
            position: relative;
            /* Масштабируем весь пиксельный рисунок */
            transform: scale(1.5);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Основной блок сердечка - создаём через box-shadow сетку */
        .pixel-heart::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff2a6d;
            top: 0;
            left: 0;
            /* Пиксельная сетка: 10x10 блоков по 10px, но с шагом 20px */
            box-shadow:
                /* Ряд 1: два пикселя сверху */
                20px 0 #ff2a6d,
                60px 0 #ff2a6d,
                80px 0 #ff2a6d,

                /* Ряд 2 */
                0 20px #ff2a6d,
                20px 20px #ff2a6d,
                40px 20px #ff2a6d,
                60px 20px #ff2a6d,
                80px 20px #ff2a6d,
                100px 20px #ff2a6d,

                /* Ряд 3 */
                0 40px #ff2a6d,
                20px 40px #ff2a6d,
                40px 40px #ff2a6d,
                60px 40px #ff2a6d,
                80px 40px #ff2a6d,
                100px 40px #ff2a6d,

                /* Ряд 4 */
                20px 60px #ff2a6d,
                40px 60px #ff2a6d,
                60px 60px #ff2a6d,
                80px 60px #ff2a6d,

                /* Ряд 5 */
                40px 80px #ff2a6d,
                60px 80px #ff2a6d,

                /* Ряд 6 (вершина) */
                40px 100px #ff2a6d,

                /* Блик (светлый пиксель) */
                20px 20px #ff9ec7,
                40px 40px #ff9ec7;
            /* Тень для объёма */
            filter: drop-shadow(0 0 12px #ff2a6d88) drop-shadow(0 0 30px #ff2a6d44);
        }

        /* Добавляем второй слой для яркости свечения */
        .pixel-heart::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: transparent;
            top: 0;
            left: 0;
            box-shadow:
                20px 0 #ff4d8f,
                60px 0 #ff4d8f,
                80px 0 #ff4d8f,
                0 20px #ff4d8f,
                20px 20px #ff4d8f,
                40px 20px #ff4d8f,
                60px 20px #ff4d8f,
                80px 20px #ff4d8f,
                100px 20px #ff4d8f,
                0 40px #ff4d8f,
                20px 40px #ff4d8f,
                40px 40px #ff4d8f,
                60px 40px #ff4d8f,
                80px 40px #ff4d8f,
                100px 40px #ff4d8f,
                20px 60px #ff4d8f,
                40px 60px #ff4d8f,
                60px 60px #ff4d8f,
                80px 60px #ff4d8f,
                40px 80px #ff4d8f,
                60px 80px #ff4d8f,
                40px 100px #ff4d8f;
            opacity: 0.4;
            filter: blur(6px);
            z-index: -1;
        }

        /* Анимация парения */
        @keyframes float {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-18px);
            }
            100% {
                transform: translateY(0);
            }
        }

        /* Пульсация свечения */
        .heart-container {
            animation: float 3s ease-in-out infinite, pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0% {
                filter: drop-shadow(0 0 8px #ff2a6d) drop-shadow(0 0 20px #ff2a6d66);
            }
            50% {
                filter: drop-shadow(0 0 18px #ff2a6d) drop-shadow(0 0 40px #ff2a6daa);
            }
            100% {
                filter: drop-shadow(0 0 8px #ff2a6d) drop-shadow(0 0 20px #ff2a6d66);
            }
        }

        /* Дополнительные мелкие пиксельные искры вокруг (для красоты) */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffb3d9;
            box-shadow: 0 0 12px #ffb3d9;
            opacity: 0;
            animation: sparkleAnim 2s infinite;
        }

        .sparkle:nth-child(1) {
            top: -30px;
            left: -20px;
            animation-delay: 0s;
        }
        .sparkle:nth-child(2) {
            top: -50px;
            right: -10px;
            animation-delay: 0.6s;
        }
        .sparkle:nth-child(3) {
            bottom: -30px;
            left: -40px;
            animation-delay: 1.2s;
        }
        .sparkle:nth-child(4) {
            bottom: -20px;
            right: -30px;
            animation-delay: 0.3s;
        }
        .sparkle:nth-child(5) {
            top: 50%;
            left: -60px;
            animation-delay: 0.9s;
        }
        .sparkle:nth-child(6) {
            top: 30%;
            right: -70px;
            animation-delay: 1.5s;
        }

        @keyframes sparkleAnim {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
            100% {
                opacity: 0;
                transform: scale(0.5);
            }
        }

        /* Текст поздравления */
        .message {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffb3d9;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #ff2a6d, 0 0 20px #ff2a6d;
            white-space: nowrap;
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="heart-container">
        <!-- Пиксельное сердечко -->
        <div class="pixel-heart"></div>

        <!-- Искры вокруг -->
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>

        <!-- Милый текст -->
        <div class="message">❤ I LOVE YOU ❤</div>
    </div>
</body>
</html>
```
